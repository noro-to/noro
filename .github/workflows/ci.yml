name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python engine and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build rules.json
        run: python tools/build_rules.py

      - name: rules.json is up to date
        run: git diff --exit-code engine/rules.json

      - name: Run tests
        run: python -m unittest discover -s tests/engine -v && python -m unittest discover -s tests/rules -v

  node:
    name: TypeScript framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # No API keys in CI: the model calls are mocked in tests.
      - run: npm test
