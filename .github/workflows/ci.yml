name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python engine and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build rules.json
        run: python tools/build_rules.py

      - name: rules.json is up to date
        run: git diff --exit-code engine/rules.json

      - name: Run tests
        run: python -m unittest discover -s tests/engine -v && python -m unittest discover -s tests/rules -v

  node:
    name: TypeScript framework (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # No API keys in CI: the model calls are mocked in tests.
      - run: npm test

  package:
    name: npm package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - name: Pack, install globally, run from another folder
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm i -g "$RUNNER_TEMP"/noro-to-noro-*.tgz
          mkdir "$RUNNER_TEMP/elsewhere"
          cp fixtures/exports/google-ads.csv "$RUNNER_TEMP/elsewhere/"
          cd "$RUNNER_TEMP/elsewhere"
          NORO_MOCK_MODELS=1 noro this google-ads.csv --yes

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: noro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image on a fixture (mocked models)
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cp fixtures/exports/google-ads.csv "$RUNNER_TEMP/work/"
          docker run --rm --user "$(id -u):$(id -g)" -e NORO_MOCK_MODELS=1 \
            -v "$RUNNER_TEMP/work:/work" -w /work noro:ci this google-ads.csv --yes
