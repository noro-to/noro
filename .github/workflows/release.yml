# Release on a version tag (v0.2.0, v0.2.1, ...): publish @noro-to/noro to npm and the
# ghcr.io/noro-to/noro image for linux/amd64 and linux/arm64.
#
# One-time setup:
# - npm: create the public org `noro-to`, publish once by hand or create the package, then on
#   npmjs.com add a Trusted Publisher (GitHub Actions, repo noro-to/noro, workflow release.yml).
#   No NPM_TOKEN secret: npm uses this workflow's OIDC token and adds provenance automatically.
# - GHCR: after the first push, make the package public under Package settings.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python -m unittest discover -s tests/engine && python -m unittest discover -s tests/rules

  npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      # prepack cleans and builds dist/. publishConfig sets access public and provenance.
      - run: npm publish

  image:
    name: Publish ghcr.io/noro-to/noro
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noro-to/noro
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
