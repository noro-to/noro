id: A-test-without-stop
slug: test-without-stop
name: Test with no stop condition
category: actions
severity: advisory
engine: regex
applies_to: text
patterns:
- \b(?:test|trial|experiment\s+with)\s+(?:a\s+|new\s+|different\s+)?(?:creative|audiences?|bids?|bidding|landing\s+pages?|copy|headlines?|budgets?)\b
unless: (?:\bif\b|\buntil\b|\bstop\b|\bend\b|\broll\s*back\b|\brevert\b|\bfor\s+\d+\s+(?:days|weeks)\b|\bafter\s+\d+\s+(?:conversions|clicks|days)\b)
message: 'Test with no stop condition: ''{match}'''
why: A test with no end date or success bar runs forever and proves nothing.
fix: 'Add the stop condition: how long, what result counts, and what happens if it fails.'
examples:
  flag:
  - Next month we will test new creative on prospecting.
  pass:
  - Test new creative on PR-03 for 14 days; if CPA isn't under $50, revert.
source: Research rounds 1–3; locked 2026-10-12.
