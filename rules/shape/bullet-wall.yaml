id: S-bullet-wall
slug: bullet-wall
name: Wall of bullets
category: shape
severity: warning
engine: count
applies_to: text
count:
  pattern: (?m)^[ \t]*(?:[-*•]|\d+\.)[ \t]+\S
  max: 8
  per: report
message: 'More than 8 bullets: ''{match}'''
why: A long bullet list has no hierarchy. The reader can't tell which line matters.
fix: Keep the 3 to 5 bullets that change the decision. Cut or merge the rest.
examples:
  flag:
  - '- Item 1 changed.

    - Item 2 changed.

    - Item 3 changed.

    - Item 4 changed.

    - Item 5 changed.

    - Item 6 changed.

    - Item 7 changed.

    - Item 8 changed.

    - Item 9 changed.

    - Item 10 changed.'
  pass:
  - '- Spend up 12%.

    - CPA up 39%.

    - Swap creative on PR-03 by Wed.'
source: Research rounds 1–3; locked 2026-10-12.
