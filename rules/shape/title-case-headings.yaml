id: S-title-case-headings
slug: title-case-headings
name: Title Case headings
category: shape
severity: advisory
engine: regex
applies_to: text
patterns:
- (?m)^#{1,6}[ \t]+(?-i:(?:[A-Z][a-z]+[ \t]+){2,}[A-Z][a-z]+)[ \t]*$
message: 'Title Case heading: ''{match}'''
why: Title Case on every heading is a template habit. Sentence-case headings that state a point read like a person wrote them.
fix: Use sentence case, and make the heading say the point ('Sunday costs the most') or drop it.
examples:
  flag:
  - '## Weekly Performance Overview Summary'
  pass:
  - '## Sunday costs the most per conversion'
source: Research rounds 1–3; locked 2026-10-12.
