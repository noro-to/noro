id: N-numbers-in-context
slug: numbers-in-context
name: Number with no comparison
category: numbers
severity: warning
engine: regex
applies_to: text
patterns:
- \b(?:spend|ROAS|CPA|CPL|CPC|CTR|CVR|conversions?|revenue|leads|cost\s+per\s+\w+)\s*(?::|is|was|of|came\s+in\s+at|totaled|hit|reached)\s*[$€£]?\d[\d,.]*\s?(?:[kKmM]\b|%|x\b)?
unless: \b(?:vs\.?|versus|against|target|goal|prior|previous|last\s+(?:week|month|year|quarter)|up|down|rose|fell|from|flat|unchanged|compared|budget|plan)\b
message: 'Number with no comparison: ''{match}'''
why: '''Spend is $50k'' can''t be judged. Every number the reader needs to act on needs its comparison.'
fix: 'Add the comparison the original gives: prior period, target or budget. If it gives none, cut the number or flag it.'
examples:
  flag:
  - Spend is $50k.
  - 'Conversions: 240.'
  - ROAS of 1.8 this month.
  pass:
  - Spend is $50k, up 20% vs last month.
  - 'Conversions: 240 against a 200 target.'
  - ROAS of 1.8, down from 2.1.
source: Final rules for clarity in ad reports (2026-10-12).
