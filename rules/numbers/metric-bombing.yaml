id: N-metric-bombing
slug: metric-bombing
name: Metric bombing
category: numbers
severity: warning
engine: count
applies_to: text
count: {pattern: '(?<![\w.$€£])(?:[$€£]\s?\d[\d,]*(?:\.\d+)?(?:\s?[km]\b)?|[+-]?\d[\d,]*(?:\.\d+)?\s?(?:%|pp\b|x\b)|\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+\.\d+|\d+\s+(?:conversions|clicks|leads|orders|sales|purchases|impressions|calls|sessions)\b)(?![^\[\]\n]*\])', max: 8, per: 100 words}
message: "More than 8 numbers per 100 words: '{match}'"
why: "Every number, no point. Clients read a one-page note with the 3–4 numbers that mattered; a wall of figures makes them find the point themselves, and most won't."
fix: "Keep the numbers the decision rests on and cut the rest. Numbers in [chart: …] descriptions don't count here; the visual rules cover charts."
examples:
  flag:
    - "Spend $48.2k (+12%), CPA $61 (+39%), CVR 9.8% (-4.3 pp), CTR 1.5% (+0.3 pp), CPC $13.52, ROAS 4.1x on 790 conversions."
  pass:
    - "CPA held at $61 on 790 conversions this month, so nothing in the account needs to change, and we will review it with you again at the next weekly call."
source: "LinkedIn 'metric bombing' (14-social-x-linkedin.md); r/agency 'one-page note with the 3–4 numbers that mattered' (02-key-quotes.md); AgencyAnalytics 5–8 metrics"
