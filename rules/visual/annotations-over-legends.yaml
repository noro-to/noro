id: V-annotations-over-legends
slug: annotations-over-legends
name: Annotations explain changes
category: visual
severity: warning
engine: judge
applies_to: visual
message: Are spikes, dips and changes annotated on the chart where they happen?
why: Readers look at the spike first. If the reason is elsewhere, they make one up.
fix: 'Add a short note at the point: ''promo ended'', ''tag outage''.'
rubric:
  question: Are spikes, dips and changes annotated on the chart where they happen?
  anchors:
    0: A visible spike or dip with no explanation
    1: Explained only in text far from the chart
    2: Annotated on the chart at the point
examples:
  flag:
  - CPA spike in week 6 explained three paragraphs later
  pass:
  - 'Note on week 6: ''budget cut 40%'''
source: 'Design principle: data speaks first. Locked chart rules, 2026-10-12.'
