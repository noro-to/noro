id: W-conversions-vs-all-conversions
slug: conversions-vs-all-conversions
name: Conversions and all conversions mixed
category: watchout
severity: advisory
engine: regex
applies_to: text
patterns:
- \ball\s+conversions\b
message: 'Check which conversion column is used: ''{match}'''
why: '''All conversions'' includes secondary actions and cross-device estimates. Mixed with ''conversions'', the math doesn''t tie.'
fix: Use one column throughout and say which.
examples:
  flag:
  - CPA was $42 based on all conversions.
  pass:
  - CPA was $42 based on primary conversions.
source: Research rounds 1–3; locked 2026-10-12.
